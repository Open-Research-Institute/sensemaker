<style>
  #postscope-root,
  #postscope-root * { box-sizing: border-box; }
  #postscope-root > * { margin: 0; }
  #postscope-root h1,
  #postscope-root h2,
  #postscope-root h3,
  #postscope-root p { margin: 0; }

  #postscope-root {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #0b0f14;
    color: #e6edf3;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.45;
    color-scheme: dark;
  }

  /* ---------- top bar ---------- */
  #postscope-root #topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: #11161d;
    border-bottom: 1px solid #30363d;
  }
  #postscope-root #topbar label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #8b949e;
    font-size: 12px;
    white-space: nowrap;
  }
  #postscope-root input {
    font: inherit;
    color: #e6edf3;
    background: #0b0f14;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 5px 8px;
  }
  #postscope-root input::placeholder { color: #8b949e; }
  #postscope-root input:hover { border-color: #8b949e; }
  #postscope-root button {
    font: inherit;
    color: #e6edf3;
    background: #11161d;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 5px 12px;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  #postscope-root button:hover { border-color: #ff6600; }
  #postscope-root #submit-btn {
    background: #ff6600;
    border-color: #ff6600;
    color: #0b0f14;
    font-weight: 600;
  }
  #postscope-root #submit-btn:hover { background: #ff7a1a; }
  #postscope-root #status {
    margin-left: auto;
    color: #8b949e;
    font-size: 12px;
  }

  #postscope-root button:focus-visible,
  #postscope-root input:focus-visible,
  #postscope-root a:focus-visible,
  #postscope-root [tabindex]:focus-visible {
    outline: 2px solid #ff6600;
    outline-offset: 2px;
  }

  /* ---------- global emoji summary strip ---------- */
  #postscope-root #global-emoji-summary {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px 12px;
    background: #0b0f14;
    border-bottom: 1px solid #30363d;
  }
  #postscope-root #global-emoji-summary .summary-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: #8b949e;
    margin-right: 6px;
  }
  #postscope-root .global-emoji-slot {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 44px;
    min-height: 44px;
    font-size: 28px;
    line-height: 1;
    background: #11161d;
    border: 1px solid #30363d;
    border-radius: 10px;
  }
  #postscope-root .global-emoji-count {
    font-size: 11px;
    color: #8b949e;
    background: #11161d;
    border: 1px solid #30363d;
    border-radius: 999px;
    padding: 1px 7px;
    margin-right: 10px;
  }

  /* ---------- main area ---------- */
  #postscope-root #main-area {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: row;
  }
  #postscope-root #stories-pane {
    flex: 1 1 auto;
    min-width: 0;
    overflow-y: auto;
    padding: 12px;
  }
  #postscope-root #spread-pane {
    flex: 0 0 32%;
    width: 32%;
    min-width: 240px;
    overflow-y: auto;
    padding: 12px;
    border-left: 1px solid #30363d;
  }
  #postscope-root .pane-heading {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: #8b949e;
    margin-bottom: 10px;
  }

  /* ---------- story cards ---------- */
  #postscope-root .story-card {
    background: #11161d;
    border: 1px solid #30363d;
    border-radius: 10px;
    margin-bottom: 10px;
    overflow: hidden;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  #postscope-root .story-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0, 0, 0, .45);
  }
  #postscope-root .story-card.open { border-color: #ff6600; }
  #postscope-root .story-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 10px 12px;
    text-align: left;
    background: none;
    border: none;
    border-radius: 0;
    color: inherit;
    cursor: pointer;
  }
  #postscope-root .story-title {
    flex: 1 1 55%;
    min-width: 180px;
    font-weight: 600;
    font-size: 14px;
  }
  #postscope-root .story-meta {
    color: #8b949e;
    font-size: 12px;
    white-space: nowrap;
  }
  #postscope-root .story-emoji-slots {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-left: auto;
  }
  #postscope-root .story-emoji-slot {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 20px;
    line-height: 1;
  }
  #postscope-root .story-emoji-count {
    font-size: 10px;
    color: #8b949e;
    background: #0b0f14;
    border: 1px solid #30363d;
    border-radius: 999px;
    padding: 0 5px;
  }
  #postscope-root .story-comments {
    display: none;
    border-top: 1px solid #30363d;
    padding: 8px 12px 10px;
  }
  #postscope-root .story-card.open .story-comments,
  #postscope-root .story-head.open + .story-comments { display: block; }

  /* ---------- comment rows ---------- */
  #postscope-root .comment-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px dashed #30363d;
  }
  #postscope-root .comment-row:last-child { border-bottom: none; }
  #postscope-root .comment-emoji { font-size: 18px; line-height: 1; }
  #postscope-root .comment-author {
    color: #ff6600;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  #postscope-root .comment-text {
    font-size: 13px;
    color: #e6edf3;
    min-width: 0;
  }

  /* ---------- spread pane ---------- */
  #postscope-root .spread-empty {
    color: #8b949e;
    font-size: 13px;
  }
  #postscope-root .spread-item {
    background: #11161d;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  #postscope-root .spread-item.is-origin { border-color: #ff6600; }
  #postscope-root .spread-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: #8b949e;
    border: 1px solid #30363d;
    border-radius: 4px;
    padding: 0 5px;
    margin-right: 6px;
  }
  #postscope-root .spread-badge.is-origin,
  #postscope-root .spread-item.is-origin .spread-badge {
    color: #ff6600;
    border-color: #ff6600;
  }
  #postscope-root .spread-time {
    color: #8b949e;
    font-size: 11px;
  }

  /* ---------- scrollbars ---------- */
  #postscope-root #stories-pane::-webkit-scrollbar,
  #postscope-root #spread-pane::-webkit-scrollbar { width: 10px; }
  #postscope-root #stories-pane::-webkit-scrollbar-thumb,
  #postscope-root #spread-pane::-webkit-scrollbar-thumb {
    background: #30363d;
    border-radius: 6px;
    border: 2px solid #0b0f14;
  }
</style>

      url: hit.url || "",
      hnUrl: HN_ITEM_BASE + "?" + hnParams.toString(),
      points: points,
      numComments: Number(hit.num_comments) || 0,
      author: hit.author || "",
      createdAt: hit.created_at_i,
      storyText: hit.story_text || "",
      frontPage: points >= cfg.frontPageMinPoints,
      raw: hit
    };
  }

  /* ---------- app.loadRange (replaced in place) ---------- */
  app.loadRange = async function loadRange(startValue, endValue) {
    st.loading = true;
    st.lastError = null;
    setStatus("loading stories");
    app.emit("sentiment:stories-loading", { start: startValue, end: endValue });
    try {
      var startUnix = util.toUnixSeconds(startValue);
      var endUnix = util.endOfDayUnixSeconds(endValue);
      if (startUnix === null || endUnix === null) {
        throw new Error("invalid date range");
      }

      var url = new URL("search_by_date", cfg.algoliaBase);
      var sp = url.searchParams;
      sp.set("tags", cfg.storyTag);
      sp.set("numericFilters", "created_at_i>" + startUnix + ",created_at_i<" + endUnix);

      var collected = [];
      var page = 0;
      var nbPages = 1;
      while (collected.length < cfg.maxStories && page < nbPages) {
        sp.set("page", String(page));
        var resp = await fetch(url.toString(), { method: "GET" });
        if (!resp.ok) { throw new Error("request failed: HTTP " + resp.status); }
        var data = await resp.json();
        var hits = (data && Array.isArray(data.hits)) ? data.hits : [];
        nbPages = (data && typeof data.nbPages === "number") ? data.nbPages : 0;
        for (var i = 0; i < hits.length; i++) {
          collected.push(normalizeHit(hits[i]));
        }
        page += 1;
      }
      if (collected.length > cfg.maxStories) {
        collected = collected.slice(0, cfg.maxStories);
      }

      st.range.start = startValue;
      st.range.end = endValue;
      st.stories = collected;

      setStatus("loaded " + collected.length + " stories (" + startValue + " – " + endValue + ")");
      app.emit("sentiment:stories", st.stories);
      return st.stories;
    } catch (err) {
      var message = (err && err.message) ? err.message : String(err);
      st.lastError = message;
      setStatus(message);
      app.emit("sentiment:error", { method: "loadRange", error: message });
      return null;
    } finally {
      st.loading = false;
    }
  };

  /* ---------- app.setRange (replaced in place) ---------- */
  app.setRange = function setRange(startValue, endValue) {
    if (startValue !== undefined && startInput) { startInput.value = startValue; }
    if (endValue !== undefined && endInput) { endInput.value = endValue; }
    var s = startInput ? startInput.value : (startValue || null);
    var e = endInput ? endInput.value : (endValue || null);
    st.range.start = s || null;
    st.range.end = e || null;
    return st.range;
  };

  /* ---------- app.reload (replaced in place) ---------- */
  app.reload = function reload() {
    return app.loadRange(st.range.start, st.range.end);
  };

  /* ---------- header control wiring (no native submit / reload) ---------- */
  function runFromInputs(ev) {
    if (ev && typeof ev.preventDefault === "function") { ev.preventDefault(); }
    var s = startInput ? startInput.value : "";
    var e = endInput ? endInput.value : "";
    app.loadRange(s, e);
  }

  function onDateKeydown(ev) {
    if (ev && (ev.key === "Enter" || ev.keyCode === 13)) {
      runFromInputs(ev);
    }
  }

  if (submitBtn) {
    submitBtn.addEventListener("click", runFromInputs);
  }
  if (startInput) {
    startInput.addEventListener("keydown", onDateKeydown);
  }
  if (endInput) {
    endInput.addEventListener("keydown", onDateKeydown);
  }

  var hostForm = null;
  if (submitBtn && submitBtn.form) { hostForm = submitBtn.form; }
  if (!hostForm && startInput && startInput.form) { hostForm = startInput.form; }
  if (!hostForm && endInput && endInput.form) { hostForm = endInput.form; }
  if (hostForm) {
    hostForm.addEventListener("submit", function (ev) {
      if (ev && typeof ev.preventDefault === "function") { ev.preventDefault(); }
    });
  }

  /* ---------- initial run ---------- */
  if (startInput && endInput && startInput.value && endInput.value) {
    app.loadRange(startInput.value, endInput.value);
  } else {
    setStatus("pick a date range");
  }
})();
</script>
