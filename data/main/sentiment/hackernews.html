<div id="postscope-root" data-emoji-set="😊 😡 😂 🤔 😢 😮 💀">
<style>
#postscope-root, #postscope-root * { box-sizing: border-box; margin: 0; }
#postscope-root {
  --ps-bg: #0b0f14;
  --ps-panel: #11161d;
  --ps-text: #e6edf3;
  --ps-muted: #8b949e;
  --ps-border: #30363d;
  --ps-accent: #ff6600;
  width: 100%;
  height: 100%;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--ps-bg);
  color: var(--ps-text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 14px;
  line-height: 1.45;
  color-scheme: dark;
}
/* ---- topbar ---- */
#postscope-root #topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.5rem 0.75rem;
  padding: 0.6rem 0.9rem;
  background: var(--ps-panel);
  border-bottom: 1px solid var(--ps-border);
}
#postscope-root #topbar label {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  font-size: 0.78rem;
  color: var(--ps-muted);
}
#postscope-root input, #postscope-root button {
  font: inherit;
  font-size: 0.85rem;
  color: var(--ps-text);
  background: var(--ps-bg);
  border: 1px solid var(--ps-border);
  border-radius: 6px;
  padding: 0.38rem 0.6rem;
}
#postscope-root button {
  cursor: pointer;
  background: #161d26;
  transition: border-color 0.15s ease, filter 0.15s ease;
}
#postscope-root button:hover { border-color: var(--ps-accent); }
#postscope-root #submit-btn {
  background: var(--ps-accent);
  border-color: var(--ps-accent);
  color: #0b0f14;
  font-weight: 700;
}
#postscope-root #submit-btn:hover { filter: brightness(1.1); }
#postscope-root #keyword-input { min-width: 11rem; }
#postscope-root #status { margin-left: auto; color: var(--ps-muted); font-size: 0.78rem; }
/* ---- classifier bar (slimmer controls) ---- */
#postscope-root #classifier-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.4rem 0.6rem;
  padding: 0.45rem 0.9rem;
  background: var(--ps-panel);
  border-bottom: 1px solid var(--ps-border);
}
#postscope-root #classifier-bar input {
  font-size: 0.78rem;
  padding: 0.24rem 0.5rem;
  border-radius: 5px;
  flex: 1 1 9rem;
  min-width: 7rem;
}
#postscope-root #classifier-bar #emoji-set { flex: 0 0 15em; min-width: 0; }
#postscope-root #classifier-status { color: var(--ps-muted); font-size: 0.74rem; }
/* ---- global emoji summary strip ---- */
#postscope-root #global-emoji-summary {
  display: flex;
  align-items: center;
  gap: 0.9rem;
  padding: 0.55rem 0.9rem;
  background: var(--ps-panel);
  border-bottom: 1px solid var(--ps-border);
}
#postscope-root #global-emoji-summary .summary-title { font-size: 0.82rem; font-weight: 600; letter-spacing: 0.02em; }
#postscope-root .global-emoji-slot {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2.4rem;
  height: 2.4rem;
  font-size: 1.45rem;
  background: var(--ps-bg);
  border: 1px solid var(--ps-border);
  border-radius: 8px;
}
#postscope-root .global-emoji-count {
  position: absolute;
  right: -0.45rem;
  bottom: -0.45rem;
  font-size: 0.6rem;
  line-height: 1;
  color: var(--ps-muted);
  background: #1b222c;
  border: 1px solid var(--ps-border);
  border-radius: 999px;
  padding: 0.15rem 0.35rem;
}
/* ---- main area ---- */
#postscope-root #main-area { flex: 1 1 auto; min-height: 0; display: flex; }
#postscope-root #stories-pane { flex: 1 1 auto; min-width: 0; overflow-y: auto; padding: 0.9rem; }
#postscope-root #spread-pane {
  flex: 0 0 32%;
  min-width: 230px;
  overflow-y: auto;
  padding: 0.9rem;
  background: var(--ps-panel);
  border-left: 1px solid var(--ps-border);
}
#postscope-root #stories-pane h2, #postscope-root #spread-pane h2 {
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ps-muted);
  margin-bottom: 0.75rem;
}
/* ---- story cards ---- */
#postscope-root .story-card {
  background: var(--ps-panel);
  border: 1px solid var(--ps-border);
  border-radius: 10px;
  margin-bottom: 0.75rem;
  overflow: hidden;
  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
}
#postscope-root .story-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
  border-color: #3d444d;
}
#postscope-root .story-card.open { border-color: var(--ps-accent); }
#postscope-root .story-head {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 0.4rem;
  width: 100%;
  text-align: left;
  padding: 0.8rem 0.9rem;
  background: transparent;
  border: 0;
  border-radius: 0;
  color: inherit;
}
#postscope-root .story-head:hover { background: #141b24; }
#postscope-root .story-title { font-size: 0.95rem; font-weight: 600; color: var(--ps-text); }
#postscope-root .story-meta { font-size: 0.74rem; color: var(--ps-muted); }
#postscope-root .story-emoji-slots { display: flex; gap: 0.45rem; }
#postscope-root .story-emoji-slot {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.85rem;
  height: 1.85rem;
  font-size: 1.15rem;
  background: var(--ps-bg);
  border: 1px solid var(--ps-border);
  border-radius: 6px;
}
#postscope-root .story-emoji-count {
  position: absolute;
  right: -0.4rem;
  bottom: -0.4rem;
  font-size: 0.58rem;
  line-height: 1;
  color: var(--ps-muted);
  background: #1b222c;
  border: 1px solid var(--ps-border);
  border-radius: 999px;
  padding: 0.12rem 0.3rem;
}
#postscope-root .story-comments { display: none; border-top: 1px solid var(--ps-border); padding: 0.5rem 0.9rem 0.7rem; }
#postscope-root .story-card.open .story-comments { display: block; }
/* ---- comment rows ---- */
#postscope-root .comment-row {
  display: grid;
  grid-template-columns: 1.7rem 1fr;
  column-gap: 0.5rem;
  row-gap: 0.1rem;
  padding: 0.45rem 0;
}
#postscope-root .comment-row + .comment-row { border-top: 1px solid #21262d; }
#postscope-root .comment-emoji { grid-row: span 2; font-size: 1.1rem; text-align: center; }
#postscope-root .comment-author { font-size: 0.74rem; font-weight: 600; color: var(--ps-accent); }
#postscope-root .comment-text { font-size: 0.84rem; color: var(--ps-text); overflow-wrap: anywhere; }
/* ---- spread pane items ---- */
#postscope-root .spread-empty { color: var(--ps-muted); font-size: 0.82rem; }
#postscope-root .spread-item {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 0.3rem;
  background: var(--ps-bg);
  border: 1px solid var(--ps-border);
  border-radius: 8px;
  padding: 0.55rem 0.7rem;
  margin-bottom: 0.6rem;
}
#postscope-root .spread-meta { font-size: 0.7rem; color: var(--ps-muted); }
#postscope-root .origin-badge {
  font-size: 0.6rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ps-accent);
  border: 1px solid var(--ps-accent);
  border-radius: 999px;
  padding: 0.12rem 0.45rem;
}
/* ---- focus, placeholder, scrollbars ---- */
#postscope-root :focus-visible { outline: 2px solid var(--ps-accent); outline-offset: 2px; }
#postscope-root input:focus-visible { outline-offset: 0; border-color: var(--ps-accent); }
#postscope-root ::placeholder { color: #6e7681; }
#postscope-root #stories-pane::-webkit-scrollbar, #postscope-root #spread-pane::-webkit-scrollbar { width: 8px; }
#postscope-root #stories-pane::-webkit-scrollbar-thumb, #postscope-root #spread-pane::-webkit-scrollbar-thumb { background: var(--ps-border); border-radius: 999px; }
#postscope-root #stories-pane::-webkit-scrollbar-track, #postscope-root #spread-pane::-webkit-scrollbar-track { background: transparent; }
@media (max-width: 640px) {
  #postscope-root #main-area { flex-direction: column; }
  #postscope-root #spread-pane { flex: 0 0 auto; width: auto; min-width: 0; border-left: 0; border-top: 1px solid var(--ps-border); }
}
</style>

<header id="topbar">
  <label>From <input type="date" id="start-date"></label>
  <label>To <input type="date" id="end-date"></label>
  <button type="submit" id="submit-btn">Run</button>
  <input type="text" id="keyword-input" placeholder="idea or term" aria-label="idea or term">
  <button type="button" id="spread-btn">Trace</button>
  <button type="button" id="download-btn">Download PNG</button>
  <span id="status" aria-live="polite">idle</span>
</header>

<div id="classifier-bar">
  <input type="text" id="llm-model" placeholder="model override, blank inherits global m">
  <input type="text" id="llm-endpoint" placeholder="endpoint override, blank inherits global h">
  <input type="password" id="llm-key" placeholder="key override, blank inherits global k" autocomplete="off">
  <input type="text" id="emoji-set" value="😊 😡 😂 🤔 😢 😮 💀" aria-label="emoji set">
  <span id="classifier-status" aria-live="polite"></span>
</div>

<div id="global-emoji-summary">
  <span class="summary-title">All comments</span>
  <span class="global-emoji-slot"><span class="global-emoji-count">0</span></span>
  <span class="global-emoji-slot"><span class="global-emoji-count">0</span></span>
  <span class="global-emoji-slot"><span class="global-emoji-count">0</span></span>
</div>

<div id="main-area">
  <section id="stories-pane">
    <h2>Stories</h2>
    <div id="story-list"></div>
  </section>
  <aside id="spread-pane">
    <h2>Idea spread</h2>
    <div id="spread-list">
      <p class="spread-empty">No trace yet — enter an idea or term and press Trace.</p>
    </div>
  </aside>
</div>

<template id="story-row-template">
  <div class="story-card">
    <button type="button" class="story-head">
      <span class="story-title"></span>
      <span class="story-meta"></span>
      <span class="story-emoji-slots">
        <span class="story-emoji-slot"><span class="story-emoji-count"></span></span>
        <span class="story-emoji-slot"><span class="story-emoji-count"></span></span>
        <span class="story-emoji-slot"><span class="story-emoji-count"></span></span>
      </span>
    </button>
    <div class="story-comments"></div>
  </div>
</template>

<template id="comment-row-template">
  <div class="comment-row">
    <span class="comment-emoji"></span>
    <span class="comment-author"></span>
    <div class="comment-text"></div>
  </div>
</template>
</div>
<script>
(async function () {
  "use strict";

  var w = window;

  /* ============================================================
     Hacker News emoji lens — shared namespace + contracts (v0)
     No fetching, no rendering, no submit binding here.
     ============================================================ */

  /* ---------- namespace: create only if missing, mutate in place ---------- */
  if (!w.sentiment) { w.sentiment = {}; }
  if (!w.sentiment.hackernews) { w.sentiment.hackernews = {}; }
  var app = w.sentiment.hackernews;

  /* ---------- fixed emoji set (read from existing root, else fallback) ---------- */
  var FALLBACK_EMOJI_SET = ["😊", "😡", "😂", "🤔", "😢", "😮", "💀"];
  function readEmojiSet() {
    try {
      var root = document.getElementById("postscope-root");
      var raw = root ? root.getAttribute("data-emoji-set") : null;
      if (raw) {
        var parts = String(raw).split(/\s+/);
        var out = [];
        for (var i = 0; i < parts.length; i++) {
          if (parts[i]) { out.push(parts[i]); }
        }
        if (out.length > 0) { return out; }
      }
    } catch (err) { /* fall through to fallback set */ }
    return FALLBACK_EMOJI_SET.slice();
  }
  app.emojiSet = readEmojiSet();

  /* ---------- identity / lifecycle ---------- */
  app.version = "v0";
  app.ready = false;

  /* ---------- config: changeable defaults (fill missing keys only) ---------- */
  app.config = app.config || {};
  var CONFIG_DEFAULTS = {
    algoliaBase: "https://hn.algolia.com/api/v1/",
    storyTag: "story",
    maxStories: 25,
    frontPageMinPoints: 20,
    commentDepth: "top-level-only",
    cachePrefix: "hn-emoji-lens:",
    dateEndInclusive: true,
    spreadSearchComments: false
  };
  for (var configKey in CONFIG_DEFAULTS) {
    if (Object.prototype.hasOwnProperty.call(CONFIG_DEFAULTS, configKey) &&
        app.config[configKey] === undefined) {
      app.config[configKey] = CONFIG_DEFAULTS[configKey];
    }
  }

  /* ---------- state: canonical shape (fill missing keys only) ---------- */
  app.state = app.state || {};
  function ensureState(key, value) {
    if (app.state[key] === undefined) { app.state[key] = value; }
  }
  ensureState("range", { start: null, end: null });
  ensureState("stories", []);
  ensureState("commentRows", []);
  ensureState("storyTop", {});
  ensureState("globalTop", []);
  ensureState("spread", { term: "", origin: null, later: [] });
  ensureState("loading", false);
  ensureState("lastError", null);

  /* ---------- tiny event system: on / off / emit ----------
     emit also dispatches a window CustomEvent with the same
     name and detail so iframe hosts can listen via
     window.addEventListener. */
  var listeners = app._listeners || {};
  app._listeners = listeners;

  app.on = function (name, fn) {
    if (typeof fn !== "function") { return function () {}; }
    var bucket = listeners[name];
    if (!bucket) { bucket = listeners[name] = []; }
    bucket.push(fn);
    return function () { app.off(name, fn); };
  };

  app.off = function (name, fn) {
    var bucket = listeners[name];
    if (!bucket) { return; }
    if (fn === undefined) { listeners[name] = []; return; }
    for (var i = bucket.length - 1; i >= 0; i--) {
      if (bucket[i] === fn) { bucket.splice(i, 1); }
    }
  };

  app.emit = function (name, detail) {
    var bucket = listeners[name];
    if (bucket && bucket.length > 0) {
      var snapshot = bucket.slice();
      for (var i = 0; i < snapshot.length; i++) {
        try { snapshot[i](detail); } catch (err) {
          if (w.console && w.console.error) {
            w.console.error("[sentiment] listener error on " + name, err);
          }
        }
      }
    }
    try {
      var evt;
      if (typeof w.CustomEvent === "function") {
        evt = new w.CustomEvent(name, { detail: detail });
      } else {
        evt = document.createEvent("CustomEvent");
        evt.initCustomEvent(name, false, false, detail);
      }
      w.dispatchEvent(evt);
    } catch (err) { /* host without CustomEvent support */ }
    return detail;
  };

  /* ---------- cache: in-memory Map + localStorage persistence ----------
     get/set are promise friendly (await works on their return
     values) but resolve synchronously whenever possible. */
  var memory = new Map();

  function stableHash(text) {
    var s = String(text === null || text === undefined ? "" : text);
    var h1 = 5381;
    var h2 = 52711;
    for (var i = 0; i < s.length; i++) {
      var c = s.charCodeAt(i);
      h1 = (((h1 << 5) + h1) + c) | 0;
      h2 = (((h2 << 5) + h2) ^ c) | 0;
    }
    return (h1 >>> 0).toString(36) + (h2 >>> 0).toString(36);
  }

  function normalizeText(text) {
    return String(text === null || text === undefined ? "" : text)
      .toLowerCase()
      .replace(/\s+/g, " ")
      .replace(/^\s+|\s+$/g, "");
  }

  function readStored(key) {
    try {
      var ls = w.localStorage;
      if (!ls) { return { found: false, value: null }; }
      var raw = ls.getItem(key);
      if (raw === null || raw === undefined) { return { found: false, value: null }; }
      return { found: true, value: JSON.parse(raw) };
    } catch (err) {
      return { found: false, value: null };
    }
  }

  function writeStored(key, value) {
    try {
      var ls = w.localStorage;
      if (ls) { ls.setItem(key, JSON.stringify(value)); }
    } catch (err) { /* storage unavailable or full; memory copy survives */ }
  }

  app.cache = {
    memory: memory,
    stableHash: stableHash,
    makeKey: function (text) {
      return app.config.cachePrefix + stableHash(normalizeText(text));
    },
    get: function (key) {
      if (memory.has(key)) { return memory.get(key); }
      var stored = readStored(key);
      if (stored.found) {
        memory.set(key, stored.value);
        return stored.value;
      }
      return null;
    },
    set: function (key, value) {
      if (value && typeof value.then === "function") {
        return value.then(function (resolved) {
          memory.set(key, resolved);
          writeStored(key, resolved);
          return resolved;
        });
      }
      memory.set(key, value);
      writeStored(key, value);
      return value;
    },
    has: function (key) {
      if (memory.has(key)) { return true; }
      return readStored(key).found;
    },
    clear: function () {
      memory.clear();
      try {
        var ls = w.localStorage;
        if (!ls) { return; }
        var prefix = app.config.cachePrefix;
        var doomed = [];
        for (var i = 0; i < ls.length; i++) {
          var k = ls.key(i);
          if (k !== null && k.indexOf(prefix) === 0) { doomed.push(k); }
        }
        for (var j = 0; j < doomed.length; j++) { ls.removeItem(doomed[j]); }
      } catch (err) { /* storage unavailable */ }
    }
  };

  /* ---------- util ---------- */
  function pad2(n) {
    n = String(n);
    return n.length < 2 ? "0" + n : n;
  }

  app.util = {
    localDateString: function (date) {
      var d = date instanceof Date ? date : new Date();
      return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
    },
    toUnixSeconds: function (value) {
      if (value === null || value === undefined || value === "") { return null; }
      if (typeof value === "number" && isFinite(value)) {
        return Math.floor(value); /* already seconds */
      }
      var d;
      if (value instanceof Date) {
        d = new Date(value.getFullYear(), value.getMonth(), value.getDate(), 0, 0, 0, 0);
      } else {
        var parts = String(value).split("-");
        if (parts.length !== 3) { return null; }
        var y = parseInt(parts[0], 10);
        var m = parseInt(parts[1], 10);
        var day = parseInt(parts[2], 10);
        if (isNaN(y) || isNaN(m) || isNaN(day)) { return null; }
        d = new Date(y, m - 1, day, 0, 0, 0, 0); /* local midnight */
      }
      return Math.floor(d.getTime() / 1000);
    },
    endOfDayUnixSeconds: function (value) {
      var start = app.util.toUnixSeconds(value);
      if (start === null) { return null; }
      /* inclusive: 23:59:59 of that day; exclusive: next local midnight */
      return app.config.dateEndInclusive ? start + 86399 : start + 86400;
    },
    escapeHtml: function (text) {
      return String(text === null || text === undefined ? "" : text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    },
    clamp: function (value, min, max) {
      var n = Number(value);
      if (isNaN(n)) { n = min; }
      if (n < min) { return min; }
      if (n > max) { return max; }
      return n;
    },
    sortEmojiCounts: function (list) {
      /* accepts [{emoji,count}], [[emoji,count]], or {emoji:count};
         returns a new array sorted by count desc, ties broken by the
         fixed emoji set order, unknown emojis last (stable). */
      var entries = [];
      var i;
      if (list === null || list === undefined) { return []; }
      if (Object.prototype.toString.call(list) === "[object Array]") {
        for (i = 0; i < list.length; i++) { entries.push(list[i]); }
      } else if (typeof list === "object") {
        for (var k in list) {
          if (Object.prototype.hasOwnProperty.call(list, k)) {
            entries.push({ emoji: k, count: list[k] });
          }
        }
      }
      var order = {};
      for (i = 0; i < app.emojiSet.length; i++) {
        if (!(app.emojiSet[i] in order)) { order[app.emojiSet[i]] = i; }
      }
      var wrapped = [];
      for (i = 0; i < entries.length; i++) {
        var item = entries[i];
        var emoji;
        var count;
        if (item !== null && typeof item === "object" &&
            Object.prototype.toString.call(item) !== "[object Array]" &&
            ("emoji" in item || "count" in item)) {
          emoji = item.emoji;
          count = item.count;
        } else if (Object.prototype.toString.call(item) === "[object Array]") {
          emoji = item[0];
          count = item[1];
        } else {
          emoji = item;
          count = 0;
        }
        wrapped.push({ item: item, emoji: emoji, count: Number(count) || 0, idx: i });
      }
      wrapped.sort(function (a, b) {
        if (b.count !== a.count) { return b.count - a.count; }
        var oa = (a.emoji in order) ? order[a.emoji] : app.emojiSet.length + a.idx;
        var ob = (b.emoji in order) ? order[b.emoji] : app.emojiSet.length + b.idx;
        return oa - ob;
      });
      var out = [];
      for (i = 0; i < wrapped.length; i++) { out.push(wrapped[i].item); }
      return out;
    },
    debounce: function (fn, wait) {
      var timer = null;
      var delay = typeof wait === "number" ? wait : 200;
      function debounced() {
        var self = this;
        var args = arguments;
        if (timer !== null) { clearTimeout(timer); }
        timer = setTimeout(function () {
          timer = null;
          fn.apply(self, args);
        }, delay);
      }
      debounced.cancel = function () {
        if (timer !== null) { clearTimeout(timer); timer = null; }
      };
      return debounced;
    }
  };

  /* ---------- placeholder public methods ----------
     Later chains replace these in place on the same object. */
  var PLACEHOLDER_METHODS = [
    "loadRange", "reload", "setRange", "loadComments", "classifyText",
